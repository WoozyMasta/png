name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - uses: rvben/rumdl@v0

      - name: Install tools
        run: make tools

      - name: Check
        run: make ci ci-test-full

  matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported Go, full behavioral suite.
          - os: ubuntu-latest
            go: '1.24'
            target: ci-test-full

          # 32-bit build and run (race is unsupported on 386).
          - os: ubuntu-latest
            go: '1.26'
            target: ci-test
            goarch: '386'
            cgo: '0'

          - os: windows-latest
            go: '1.26'
            target: ci-test

          - os: macos-latest
            go: '1.26'
            target: ci-test

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Install make
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y

      - name: Test
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: make ${{ matrix.target }}

  release:
    needs: [gate, matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Extract changelog
        run: make release-notes > release.md

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          bodyFile: release.md

      - name: Request pkg.go.dev reindex
        env:
          MODULE: github.com/woozymasta/png
          VERSION: ${{ github.ref_name }}
        run: >-
          curl -sSfX POST --retry 3 --retry-delay 2
          "https://pkg.go.dev/fetch/${MODULE}@${VERSION}"
